services:
  postgres:
    image: postgres:17
    container_name: url_shortener_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: url_shortener
      POSTGRES_PASSWORD: url-shortner-dev-password
      POSTGRES_DB: url_shortener
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    container_name: url_shortener_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  backend:
    build:
      context: ./backend
    container_name: url_shortener_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://url_shortener:url-shortner-dev-password@postgres:5432/url_shortener
      REDIS_URL: redis://redis:6379
      FRONTEND_URL: http://localhost:5000
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3000/api/v1/auth/google/callback}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3000
        NEXT_PUBLIC_APP_URL: http://localhost:5000
        BACKEND_API_URL: http://backend:3000
    container_name: url_shortener_frontend
    restart: unless-stopped
    environment:
      BACKEND_API_URL: http://backend:3000
    ports:
      - "5000:5000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
