name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: url_shortener
          POSTGRES_PASSWORD: url-shortner-test-password
          POSTGRES_DB: url_shortener_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U url_shortener -d url_shortener_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      NODE_ENV: test
      DATABASE_URL_TEST: postgresql://url_shortener:url-shortner-test-password@localhost:5432/url_shortener_test
      REDIS_URL_TEST: redis://localhost:6379/1
      FRONTEND_URL: http://localhost:5000
      JWT_SECRET: ci-test-secret-change-me
      JWT_ACCESS_EXPIRES_IN: 15m
      GOOGLE_CLIENT_ID: ci-test-client
      GOOGLE_CLIENT_SECRET: ci-test-secret
      GOOGLE_CALLBACK_URL: http://localhost:3000/api/v1/auth/google/callback

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Run tests
        run: npm run test:run

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:5000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t url-shortener-backend:ci ./backend

      - name: Build frontend image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_API_URL=http://localhost:3000
          --build-arg NEXT_PUBLIC_APP_URL=http://localhost:5000
          -t url-shortener-frontend:ci
          ./frontend
