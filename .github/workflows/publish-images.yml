name: Publish Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: 
  contents: read

jobs:
  publish: 
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      id-token: write

    env:
      PROJECT_ID: project-40103b09-6157-4570-a24
      REGION: asia-south2
      REPOSITORY: shortlyweb

      BACKEND_IMAGE: asia-south2-docker.pkg.dev/project-40103b09-6157-4570-a24/shortlyweb/backend
      FRONTEND_IMAGE: asia-south2-docker.pkg.dev/project-40103b09-6157-4570-a24/shortlyweb/frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: project-40103b09-6157-4570-a24
          workload_identity_provider: projects/51673888941/locations/global/workloadIdentityPools/shortlyweb-github/providers/github-actions
          service_account: shortlyweb-deployer@project-40103b09-6157-4570-a24.iam.gserviceaccount.com

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker authentication
        run: gcloud auth configure-docker asia-south2-docker.pkg.dev --quiet

      - name: Build backend image
        run: |
          docker build \
            -t "${BACKEND_IMAGE}:${GITHUB_SHA}" \
            ./backend

      - name: Push backend image
        run: |
          docker push "${BACKEND_IMAGE}:${GITHUB_SHA}"

      - name: Build frontend image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=https://api.shortlyweb.in \
            --build-arg NEXT_PUBLIC_APP_URL=https://shortlyweb.in \
            --build-arg BACKEND_API_URL=https://api.shortlyweb.in \
            -t "${FRONTEND_IMAGE}:${GITHUB_SHA}" \
            ./frontend

      - name: Push frontend image
        run: |
          docker push "${FRONTEND_IMAGE}:${GITHUB_SHA}"
    
      
