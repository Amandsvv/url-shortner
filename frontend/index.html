<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        #url{

        }
    </style>
    <title>Url Shortner</title>
</head>

            <button id="generate-btn">Generate</button>
        </div>

    </div>
</body>
